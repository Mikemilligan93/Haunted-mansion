<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haunted Mansion</title>
<style>
  @font-face {
    font-family: "DotGothic16";
    src: url("assets/fonts/DotGothic16-Regular.ttf") format("truetype");
    font-display: swap;
  }
  html, body { margin: 0; height: 100%; background: #0d0b12; overflow: hidden; }
  #game, #ui { position: absolute; left: 0; top: 0; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { pointer-events: none; }
  /* testing modal */
  #devtools {
    position: fixed; right: 10px; top: 10px; bottom: 10px; width: 330px; z-index: 30; display: none;
    overflow-y: auto; background: #1a1020f2; color: #f2e6cc; border: 2px solid #000;
    box-shadow: inset 0 0 0 2px #3a3340; font: 13px "DotGothic16", "Courier New", monospace; padding: 10px;
  }
  #devtools h3 { margin: 12px 0 6px; font-size: 13px; color: #c9d3e0; border-bottom: 1px solid #3a3340; padding-bottom: 2px; }
  #devtools h3:first-child { margin-top: 0; }
  #devtools button, #devtools select, #devtools input[type=number], #devtools input[type=text], #devtools textarea {
    font: inherit; background: #2e2b3a; color: #f2e6cc; border: 1px solid #000; padding: 2px 6px; margin: 2px 2px 2px 0;
  }
  #devtools button { cursor: pointer; }
  #devtools button.on { background: #6e1f35; }
  #devtools label { display: inline-block; margin: 2px 8px 2px 0; cursor: pointer; }
  #devtools .row { margin: 3px 0; }
  #devtools input[type=range] { width: 200px; vertical-align: middle; }
  #devtools .hint { color: #8b95a8; font-size: 11px; }
  #devtools textarea { width: 96%; height: 50px; }
  #devtools a { color: #c9d3e0; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<canvas id="ui"></canvas>
<div id="devtools"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
